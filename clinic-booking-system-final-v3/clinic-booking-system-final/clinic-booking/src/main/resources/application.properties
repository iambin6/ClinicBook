# =========================
# APPLICATION
# =========================
spring.application.name=clinic-booking

spring.config.import=optional:application-secret.properties

# =========================
# DATABASE CONFIG
# =========================
spring.datasource.url=jdbc:mysql://localhost:3306/clinicbookingdb
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# =========================
# GOOGLE LOGIN (SAFE)
# =========================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# =========================
# FACEBOOK LOGIN (SAFE)
# =========================
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.redirect-uri=http://localhost:8080/login/oauth2/code/facebook

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# =========================
# EMAIL LOGIN (SAFE)
# =========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.default-encoding=UTF-8

app.mail.from=${MAIL_USERNAME}

# =========================
# JWT
# =========================
auth.jwt.secret=${JWT_SECRET}

# =========================
# GEMINI API (SAFE)
# =========================
gemini.api.key=${GEMINI_API_KEY}
gemini.model=gemini-2.5-pro
gemini.timeout.ms=100000
gemini.api.base=https://generativelanguage.googleapis.com/v1beta

# =========================
# QDRANT CLOUD (SAFE)
# =========================
qdrant.host=${QDRANT_HOST}
qdrant.port=${QDRANT_PORT}
qdrant.tls=${QDRANT_TLS}
qdrant.apiKey=${QDRANT_API_KEY}
qdrant.collection=nano_knowledge_base
qdrant.vector-size=1536
qdrant.distance=COSINE

# =========================
# FILE UPLOAD
# =========================
upload.path=uploads/excel
app.upload.result-dir=uploads/excel/results
