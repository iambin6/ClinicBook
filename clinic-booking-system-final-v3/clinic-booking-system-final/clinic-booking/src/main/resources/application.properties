# =========================
# APPLICATION & SERVER
# =========================
spring.application.name=clinic-booking
server.port=${PORT:8080}
server.forward-headers-strategy=framework
app.frontend.url=${APP_FRONTEND_URL:https://clinicbooking-j9r1.onrender.com}
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true

spring.config.import=optional:application-secret.properties

# =========================
# DATABASE CONFIG
# =========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/clinicbookingdb}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# =========================
# GOOGLE LOGIN (SAFE)
# =========================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.client-authentication-method=client_secret_post

# =========================
# FACEBOOK LOGIN (SAFE)
# =========================
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.redirect-uri={baseUrl}/login/oauth2/code/facebook

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.client.RestTemplate=DEBUG

# =========================
# EMAIL LOGIN (SAFE)
# =========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.default-encoding=UTF-8

app.mail.from=${MAIL_USERNAME}

# =========================
# JWT
# =========================
auth.jwt.secret=${JWT_SECRET}

# =========================
# GEMINI API (SAFE)
# =========================
gemini.api.key=${GEMINI_API_KEY}
gemini.model=gemini-2.0-flash
gemini.timeout.ms=100000
gemini.api.base=https://generativelanguage.googleapis.com/v1beta

# =========================
# QDRANT CLOUD (SAFE)
# =========================
qdrant.host=${QDRANT_HOST}
qdrant.port=${QDRANT_PORT}
qdrant.tls=${QDRANT_TLS}
qdrant.apiKey=${QDRANT_API_KEY}
qdrant.collection=nano_knowledge_base
qdrant.vector-size=1536
qdrant.distance=COSINE

# =========================
# FILE UPLOAD
# =========================
upload.path=uploads/excel
app.upload.result-dir=uploads/excel/results
