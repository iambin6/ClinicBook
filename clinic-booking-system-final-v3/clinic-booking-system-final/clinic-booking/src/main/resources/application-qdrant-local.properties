# Activate explicitly with --spring.profiles.active=qdrant-local.
spring.config.import=optional:file:./.qdrant-local.properties
qdrant.enabled=true
qdrant.host=127.0.0.1
qdrant.port=6334
qdrant.tls=false
qdrant.api-key=${QDRANT_LOCAL_API_KEY}
logging.level.com.nano.clinicbooking.service.chat.ClinicKnowledgeService=DEBUG
