# Activated by the Docker image. Local development keeps its existing profile.
server.address=0.0.0.0
server.port=${PORT:10000}

# Bound database waits so failed connectivity produces an error instead of a silent deploy timeout.
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.initialization-fail-timeout=10000
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.data-source-properties.connectTimeout=10000
spring.datasource.hikari.data-source-properties.socketTimeout=20000

logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.oauth2=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.client.RestTemplate=INFO
