# Docker enables this profile; local Maven/IDE runs keep their existing defaults.
server.address=0.0.0.0
server.port=${PORT:10000}
server.tomcat.threads.max=16
server.tomcat.threads.min-spare=2

# Bound connection waits and avoid maintaining idle database connections on Free.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.initialization-fail-timeout=10000
spring.datasource.hikari.data-source-properties.connectTimeout=10000
spring.datasource.hikari.data-source-properties.socketTimeout=20000

logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.oauth2=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.client.RestTemplate=INFO
