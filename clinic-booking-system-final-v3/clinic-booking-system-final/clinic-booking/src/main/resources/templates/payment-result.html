<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Kết quả thanh toán</title>
    <style>
        body { font-family: Arial, sans-serif; text-align:center; padding-top:80px; }
        .ok { color: green; font-weight:bold; }
        .fail { color: red; font-weight:bold; }
        a { display:inline-block; margin-top:20px; padding:10px 20px; background:#007bff; color:white; border-radius:5px; text-decoration:none;}
    </style>
</head>
<body>
<h2 th:text="${message}" th:class="${success} ? 'ok' : 'fail'"></h2>
<a href="/frontend/my-appointments">Trở về lịch hẹn</a>
</body>
</html>
