services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_LOCAL_API_KEY:?Generate .qdrant-local.properties first}
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - clinic_qdrant_data:/qdrant/storage

volumes:
  clinic_qdrant_data:
